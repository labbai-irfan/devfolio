name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Syntax check
        run: |
          bash -n bin/labbai-irfan
          find scripts src -name '*.sh' -exec bash -n {} +

      - name: ShellCheck
        run: |
          shellcheck bin/labbai-irfan
          find scripts src -name '*.sh' -exec shellcheck {} +

      - name: Validate profile data
        run: bash scripts/validate-data.sh

      # What protects people who run `npx labbai-irfan`: no dependencies to compromise,
      # and no install scripts that run code on their machine at install time.
      - name: No dependencies or install scripts
        run: |
          node -e "
            const p = require('./package.json');
            const deps = ['dependencies','optionalDependencies','peerDependencies','bundleDependencies'].filter(k => p[k] && Object.keys(p[k]).length);
            const hooks = ['preinstall','install','postinstall','prepare'].filter(k => p.scripts && p.scripts[k]);
            if (deps.length || hooks.length) { console.error('Not allowed in package.json:', [...deps, ...hooks].join(', ')); process.exit(1); }
            console.log('OK: no runtime dependencies, no install scripts');"

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Smoke test
        run: |
          LABBAI_OFFLINE=1 bash scripts/build.sh
          bash scripts/smoke-test.sh

  package:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Install jq (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install jq -y --no-progress

      - name: Build profile data
        run: npm run build

      - name: Pack and check size
        shell: bash
        run: |
          npm pack --json --ignore-scripts > pack.json
          node -e "const [p] = require('./pack.json'); console.log(p.filename, p.unpackedSize, 'bytes unpacked'); if (p.unpackedSize > 100 * 1024) { console.error('Package is larger than 100 KB'); process.exit(1); }"

      - name: Smoke test the packed tarball
        shell: bash
        run: |
          tgz="$(node -p "require('./pack.json')[0].filename")"
          npx --yes "./$tgz" --card
