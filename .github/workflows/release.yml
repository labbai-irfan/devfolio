name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # The full CI pipeline (lint, smoke tests, package on Linux/macOS/Windows) must pass first.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm Trusted Publishing (OIDC): no NPM_TOKEN secret needed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Release checks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-check.sh

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          # Pre-release versions such as 0.9.0-rc.1 go to the "next" tag, so "npx labbai-irfan" keeps the stable release.
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          # prepack runs scripts/build.sh, so the profile data is compiled into the package.
          # Trusted Publishing adds provenance automatically.
          npm publish --access public --tag "$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          # Release notes are the CHANGELOG section for this version.
          awk -v heading="## [$version]" 'index($0, heading) == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          prerelease=""
          if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file notes.md $prerelease
