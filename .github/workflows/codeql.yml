name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, so new CodeQL queries also run on unchanged code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        # JavaScript: the npx launcher and npm script runner. Actions: the workflows themselves.
        # Bash isn't supported by CodeQL; ShellCheck in ci.yml covers it.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
