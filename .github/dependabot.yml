version: 2
updates:
  # Workflow actions (checkout, setup-node, codeql) are the main supply-chain surface of this repo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # The package has no dependencies today; this catches any that get added.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
